services:
  postgres:
    image: postgres:17-alpine
    container_name: paipen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: paipen
      POSTGRES_PASSWORD: paipen_dev_password
      POSTGRES_DB: paipen
    ports:
      - "5432:5432"
    volumes:
      - paipen_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paipen -d paipen"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  paipen_postgres_data: